{% extends "base.html" %}
{% block content %}
<h2 style="margin:0 0 16px; color:#1b5e20; font-size:20px; font-weight:700;">
  ✉️ Nuevo mensaje de contacto
</h2>
<p style="margin:0 0 16px; color:#333; font-size:15px; line-height:1.6;">
  Alguien completó el formulario de contacto en la sección de Ayuda del sitio.
</p>
<table width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#f1f8f1; border-left:4px solid #1b5e20;
              border-radius:4px; margin-bottom:20px;">
  <tr><td style="padding:10px 16px; border-bottom:1px solid #ddeedd;">
    <span style="color:#555; font-size:13px;">Nombre</span><br/>
    <strong style="color:#1b5e20;">{{ nombre }}</strong>
  </td></tr>
  <tr><td style="padding:10px 16px; border-bottom:1px solid #ddeedd;">
    <span style="color:#555; font-size:13px;">Email de contacto</span><br/>
    <strong style="color:#333;">{{ email }}</strong>
  </td></tr>
  <tr><td style="padding:10px 16px;">
    <span style="color:#555; font-size:13px;">Mensaje</span><br/>
    <span style="color:#333; white-space:pre-wrap;">{{ mensaje }}</span>
  </td></tr>
</table>
<p style="margin:0; color:#777; font-size:13px;">
  Para responder, escribile directamente a {{ email }}.
</p>
{% endblock %}
